appId: com.ddash.app
productName: DDash
copyright: Copyright © 2026 DDash

directories:
  output: release/${version}
  buildResources: build
  app: .

files:
  - from: .stage
    to: .
  - package.json
  - node_modules/**/*

asarUnpack:
  - "**/node_modules/node-pty/**/*"

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DDash

publish:
  provider: github
  owner: HgGamer
  repo: DDash
  releaseType: release

extraMetadata:
  main: main/index.js
