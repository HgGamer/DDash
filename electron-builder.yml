appId: com.dash.app
productName: Dash
copyright: Copyright © 2026 Dash

directories:
  output: release/${version}
  buildResources: build
  app: .

files:
  - from: .stage
    to: .
  - package.json
  - node_modules/**/*

asarUnpack:
  - "**/node_modules/node-pty/**/*"

# Menu-bar (Tray) icon needs a real file at runtime; ship it as a resource.
extraResources:
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dash

publish:
  provider: github
  owner: HgGamer
  repo: DDash
  releaseType: release

extraMetadata:
  main: main/index.js
