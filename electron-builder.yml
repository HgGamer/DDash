appId: com.dash.app
productName: Dash
copyright: Copyright © 2026 Dash

directories:
  output: release/${version}
  buildResources: build
  app: .

files:
  - from: .stage
    to: .
  - package.json
  - node_modules/**/*

asarUnpack:
  - "**/node_modules/node-pty/**/*"

# Menu-bar (Tray) icon needs a real file at runtime; ship it as a resource.
extraResources:
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# Installed app: per-user install (no admin prompt), with Start-menu and
# desktop shortcuts. Artifact names are per-target so both builds stay apart.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dash
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

publish:
  provider: github
  owner: HgGamer
  repo: DDash
  releaseType: release

extraMetadata:
  main: main/index.js
